<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPS — Processes: data, calculations (cell by cell) and saving</title>
<style>
  :root{--red:#CC0000;--ink:#1a1a1a;--gray:#5b6470;--panel:#fff;--bg:#eef0f3;--line:#e2e5ea;--chip:#f1f3f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:linear-gradient(120deg,#2b2f36,#3a3f47);color:#fff;padding:26px 20px 20px}
  h1{margin:0 auto;font-size:25px;font-weight:800;max-width:1100px}
  h1 .r{color:#ff6b6b}
  header p{margin:6px auto 0;color:#c9ced6;font-size:14px;max-width:1100px}
  .bar{max-width:1100px;margin:16px auto 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  #q{flex:1;min-width:220px;padding:11px 14px;border:1px solid #4b515b;border-radius:10px;background:#20242a;color:#fff;font-size:15px}
  #q::placeholder{color:#8b929c}
  .count{color:#c9ced6;font-size:13px}
  .toolbtn{padding:9px 12px;border:1px solid #4b515b;border-radius:9px;background:#20242a;color:#dfe3e8;font-size:13px;cursor:pointer}
  main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
  .phase{margin:26px 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);border-bottom:2px solid var(--line);padding-bottom:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .chead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  .num{flex:none;width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
  .num.base{background:#455A64}
  .ctitle{flex:1;min-width:0}.ctitle .nm{font-weight:700;font-size:17px}
  .ctitle .sc{font-size:12.5px;color:var(--gray);font-family:ui-monospace,Consolas,monospace}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#fdecec;color:#b30000;white-space:nowrap}
  .tag.load{background:#eef1f5;color:#5b6470}
  .caret{color:var(--gray);font-size:13px;transition:transform .15s}
  .card.open .caret{transform:rotate(90deg)}
  .body{display:none;padding:6px 18px 18px}.card.open .body{display:block}
  .row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:none}
  .k{font-size:12.5px;font-weight:700;color:var(--gray);padding-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .k .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .d-in{background:#1f538d}.d-ca{background:#b26a00}.d-sv{background:#1f7a33}.d-dp{background:#8a8f98}
  .v{font-size:14px}
  .tbl{display:inline-block;background:#eef5ee;color:#1f7a33;border:1px solid #cfe6cf;padding:1px 7px;border-radius:6px;margin:2px 4px 2px 0;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .src{display:inline-block;background:#eaf1fa;color:#1f538d;border:1px solid #d3e2f5;padding:1px 7px;border-radius:6px;margin:2px 4px 2px 0;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .dep{display:inline-block;background:var(--chip);color:var(--gray);border:1px solid var(--line);padding:1px 8px;border-radius:20px;margin:2px 4px 2px 0;font-size:12px}
  .none{color:var(--gray);font-style:italic}
  code{background:#f4f2ef;border:1px solid #eadfce;color:#7a4b00;padding:.5px 5px;border-radius:5px;font-size:12.5px}
  .grp{margin:12px 0 4px;font-size:12px;font-weight:800;color:var(--red);letter-spacing:.04em}
  table.cells{width:100%;border-collapse:collapse;font-size:13px;margin:2px 0 6px}
  table.cells td{border-top:1px solid var(--line);padding:5px 8px;vertical-align:top}
  table.cells td.c{width:150px;font-family:ui-monospace,Consolas,monospace;font-weight:700;color:#0b3d66}
  table.cells td.f{font-family:ui-monospace,Consolas,monospace;color:#333}
  .note{font-size:12.5px;color:var(--gray);font-style:italic;margin-top:6px}
  footer{max-width:1100px;margin:0 auto;padding:0 16px 40px;color:var(--gray);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>DPS <span class="r">·</span> Processes: data, calculations (cell by cell) and saving</h1>
  <p>Sheet per process: what we <b>insert</b> and from where, what we <b>calculate</b> — cell/column by cell with its formula — and what we <b>save</b>. DB: <code>InkoovaProjects</code>. Notation: <code>·</code> multiply, <code>Σ</code> sum, <code>IF(cond;a;b)</code> conditional, <code>←</code> source.</p>
  <div class="bar">
    <input id="q" placeholder="Search process, cell, table or formula… (e.g. Calc_J, qty_total, BDGT4)">
    <button class="toolbtn" id="expand">Expand all</button>
    <span class="count" id="count"></span>
  </div>
</header>
<main id="main"></main>
<footer id="foot"></footer>

const main=document.getElementById('main'),foot=document.getElementById('foot');
const chips=(a,cl)=>a.map(x=>`<span class="${cl}">${x}</span>`).join('');
const depChips=a=>a.length?a.map(x=>`<span class="dep">${x}</span>`).join(''):'<span class="none">— no dependencies</span>';
function cellsHtml(cells){
  if(!cells||!cells.length) return '<div class="note">No detail.</div>';
  let out='',g=null;
  cells.forEach(x=>{ if(x.g!==g){ if(g!==null) out+='</table>'; g=x.g; out+=`<div class="grp">${g}</div><table class="cells">`; }
    out+=`<tr><td class="c">${x.c}</td><td class="f">${x.f}</td></tr>`; });
  return out+'</table>';
}
function render(list){
  main.innerHTML='';let phase=null;
  list.forEach(p=>{
    if(p.phase!==phase){phase=p.phase;const h=document.createElement('div');h.className='phase';h.textContent=phase;main.appendChild(h);}
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`
      <div class="chead">
        <div class="num ${p.n==='◆'?'base':''}">${p.n}</div>
        <div class="ctitle"><div class="nm">${p.name}</div><div class="sc">${p.scripts}</div></div>
        <span class="tag ${p.tag==='calculation'?'':'load'}">${p.tag}</span>
        <div class="caret">▶</div>
      </div>
      <div class="body">
        <div class="row"><div class="k"><span class="dot d-in"></span>We insert / source</div><div class="v"><div style="margin-bottom:6px">${p.ins}</div>${chips(p.origen,'src')}</div></div>
        <div class="row"><div class="k"><span class="dot d-ca"></span>We calculate<br>(cell by cell)</div><div class="v"><div style="margin-bottom:4px">${p.calc}</div>${cellsHtml(p.cells)}</div></div>
        <div class="row"><div class="k"><span class="dot d-sv"></span>We save</div><div class="v">${chips(p.save,'tbl')}</div></div>
        <div class="row"><div class="k"><span class="dot d-dp"></span>Depends on</div><div class="v">${depChips(p.deps)}</div></div>
      </div>`;
    c.querySelector('.chead').addEventListener('click',()=>c.classList.toggle('open'));
    main.appendChild(c);
  });
  document.getElementById('count').textContent=`${list.length} processes`;
}
function filter(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  if(!q){render(P);return;}
  render(P.filter(p=>JSON.stringify(p).toLowerCase().includes(q)));
  main.querySelectorAll('.card').forEach(c=>c.classList.add('open'));
}
document.getElementById('q').addEventListener('input',filter);
let ex=false;document.getElementById('expand').addEventListener('click',()=>{ex=!ex;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('open',ex));
  document.getElementById('expand').textContent=ex?'Collapse all':'Expand all';});
render(P);
foot.innerHTML='The <b>26 processes</b> (+ Update Master Data), cell/column by cell with its formula (Info: source ← column; Process: calculation). Extracted from the code of each Info/Process + <code>Procesos_Origen_Datos.xlsx</code>. '+
  'Tag <b>calculation</b> = applies formulas; <b>load</b> = only maps and inserts. Notation: <code>·</code> multiply, <code>Σ</code> sum, <code>IF(cond;a;b)</code> conditional, <code>←</code> source.';
</script>
